[store]
summary = A Pomodoro timer for focused reading: big countdown, breaks, round dots, minutes left in the status line.
description = Work in focused rounds and rest in between. Pomodoro shows a large countdown with a progress bar and dots for the rounds of the set. The timer keeps running while you read or the reader sleeps, and survives a restart: a round carries on by the clock, or moves on if its time ran out. A notice tells you when a round or break is over. The clock updates once a minute to save battery; an option keeps the screen awake during a round (off by default). After the set it suggests a long break. Lengths and the number of rounds are set in the settings; the next phase can start by itself. The minutes left can show in the status lines. Works with buttons and touch.
group = tools
tags = pomodoro, timer, focus, productivity
licence = CC0-1.0
sdk = 0.5

[source]
repository = https://github.com/hthoene/pomodoro
revision = v0.1.7

