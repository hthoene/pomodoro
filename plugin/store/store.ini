1-x4.png = The Pomodoro screen on the Xteink X4, a focus round running, with a progress bar, round dots and Pause, Skip and Reset buttons.
2-boox-go-7.png = The Pomodoro screen on the Boox Go 7 with a large clock, progress bar, round dots and Pause, Skip and Reset buttons.
3-x4-night.png = The Pomodoro screen on the Xteink X4 in night mode, with the clock counting down.
